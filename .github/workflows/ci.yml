name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # tsc needs a larger stack than the default for this project (deep but finite
        # type-checking recursion); the typecheck script raises ulimit + node --stack-size.
        run: ulimit -s unlimited; npm run typecheck

      - name: Test
        run: npm test
